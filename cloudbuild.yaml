# =============================================================================
# cloudbuild.yaml (repo root) — builds ALL THREE images in one submission
# =============================================================================
# Run from the repo root:
#   gcloud builds submit --config cloudbuild.yaml . \
#     --project=job-postings-full-gcp-project \
#     --substitutions=_AR_LOCATION=us-central1,_AR_REPO=job-pipeline-repo
#
# This replaces bootstrap_refresh.sh's old Step 3.5, which rebuilt the
# Dataflow image from an ad hoc inline Dockerfile + a hardcoded, independently
# pinned dependency list on every single run — silently drifting from
# pipeline/requirements.txt, and tagging the result "beam-pipeline" while the
# rest of the project expected "pipeline-dataflow". One source of truth now:
# each service's own Dockerfile + requirements.txt, built from here.
# =============================================================================

substitutions:
  _AR_LOCATION: us-central1
  _AR_REPO: job-pipeline-repo

images:
  - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector:latest'
  - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/pipeline-dataflow:latest'
  - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/bq-proxy:latest'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'collector'
    args: ['build', '-t',
           '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector:latest', '.']
    id: build-collector

  - name: 'gcr.io/cloud-builders/docker'
    dir: 'pipeline'
    args: ['build', '-t',
           '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/pipeline-dataflow:latest', '.']
    id: build-pipeline-dataflow

  - name: 'gcr.io/cloud-builders/docker'
    dir: 'dashboard'
    args: ['build', '-t',
           '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/bq-proxy:latest', '.']
    id: build-bq-proxy

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
